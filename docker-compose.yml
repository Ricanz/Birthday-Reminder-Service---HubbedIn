version: '3.8'

services:
  api:
    build: .
    container_name: birthday-api
    command: node dist/server.js
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  worker:
    build: .
    container_name: birthday-worker
    command: node dist/worker/index.js
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: birthday-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: birthday
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: